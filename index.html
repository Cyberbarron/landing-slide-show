<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="preloader">
        <div class="preloader-header">
            <div class="preloader-header-row">
                <h1>Studios</h1>
            </div>
        </div>
        <div class="preloader-footer">
            <div class="preloader-counter">
                <h1>000</h1>
            </div>
            <div class="preloader-footer-copy">
                <p>Currently Developing</p>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-logo">
            <p>Underlume</p>
        </div>
        <div class="nav-toggler">
            <p>Menu</p>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-header">
            <div class="hero-header-row">
                <h1>Everything</h1>
            </div>
            <div class="hero-header-row">
                <h1>Beneath</h1>
                <div class="hero-header-img">
                    <img src="ink.jpg">
                    <img src="download.jpg" alt="">
                    <img src="drink.jpg">
                    <img src="great.jpg">
                    <img src="blessed.jpg">
                    <img src="panda.jpg">
                    <img src="peak.jpg">
                    <img src="promise.jpg">
                    <img src="sat.jpg">
                    <img src="size.jpg">
                </div>
            </div>
            <div class="hero-header-row">
            <h1>The Surface</h1>
            </div>
        </div>
        <div class="hero-footer">
            <p>Seen and Unseen</p>
        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="main.js"></script>
</body>
</html>
